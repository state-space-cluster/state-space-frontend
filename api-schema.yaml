                    - - 19
                      - 22
                    - - 43
                      - 50
                PENDING:
                  value:
                    job_id: 550e8400-...
                    status: PENDING
                    result: null
                FAILED:
                  value:
                    job_id: 550e8400-...
                    status: FAILED
                    result: null
                    error: 'Cannot multiply: A is 1×3, B is 2×2.'
          description: Job found. Check `status` field.
        '404':
          description: No job found for the given job_id.
        '401':
          description: Authentication credentials were not provided or are invalid.
    post:
      operationId: matrix_create_2
      description: |-
        Accepts two matrices and dispatches an asynchronous Celery task to compute A × B using **Strassen's Algorithm** (O(n^2.807)).

        Returns **202 Accepted** immediately with a `job_id`. Poll `GET /api/matrix/<job_id>/` for the result.

        Results are cached in Redis (24h) and the DB so identical inputs skip computation entirely.
      summary: Submit a matrix multiplication job
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:

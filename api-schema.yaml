components:
  schemas:
    AuthToken:
      type: object
      properties:
        token:
          type: string
          readOnly: true
      required:
      - token
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    DFAInputRequest:
      type: object
      properties:
        regex:
          type: string
          minLength: 1
          description: Regular expression in infix notation, e.g. `(a|b)*c`.
          maxLength: 255
      required:
      - regex
    DFAResult:
      type: object
      properties:
        regex_hash:
          type: string
          description: MD5 hex digest of the regex. Use as the GET lookup key.
        regex_pattern:
          type: string
          description: The original regex string submitted.
        nfa_json:
          type: object
          additionalProperties: {}
          description: NFA graph produced by Thompson's Construction. Contains `start_id`,
            `end_id`, and `states` (recursive adjacency structure).
        dfa_json:
          type: object
          additionalProperties: {}
          description: DFA graph produced by Subset Construction. Contains `start_id`
            and a flat `states` list with `id`, `is_end`, and `transitions` (char
            → state_id).
        cached:
          type: boolean
          description: True if the result was returned from the database cache.
      required:
      - dfa_json
      - nfa_json
      - regex_hash
      - regex_pattern
    MatrixInputRequest:
      type: object
      properties:
        matrix_a:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: First matrix as a 2-D array of numbers.
        matrix_b:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: Second matrix as a 2-D array of numbers.
      required:
      - matrix_a
      - matrix_b
    MatrixJobAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
          description: Unique job identifier. Use this to poll for the result.
        status:
          type: string
          description: Always "PENDING" immediately after submission.
        message:
          type: string
          description: Human-readable polling hint.
      required:
      - job_id
      - message
      - status
    MatrixJobStatus:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Current lifecycle state of the job.

            * `PENDING` - PENDING
            * `PROCESSING` - PROCESSING
            * `COMPLETED` - COMPLETED
            * `FAILED` - FAILED
        result:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          nullable: true
          description: The 2-D result matrix. Null until status is COMPLETED.
        error:
          type: string
          description: Error message. Only present when status is FAILED.
      required:
      - job_id
      - result
      - status
    StatusEnum:
      enum:
      - PENDING
      - PROCESSING
      - COMPLETED
      - FAILED
      type: string
      description: |-
        * `PENDING` - PENDING
        * `PROCESSING` - PROCESSING
        * `COMPLETED` - COMPLETED
        * `FAILED` - FAILED
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Token-based authentication. Value format: `Token <your-token>`'
